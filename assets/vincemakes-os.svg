<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vincemakes animated product constellation header</title>
  <desc id="desc">A GitHub profile header for Vincemakes showing products, tools, systems, FlowPix, agents, media, and interface craft.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11100D"/>
      <stop offset="0.56" stop-color="#17140F"/>
      <stop offset="1" stop-color="#0B0A08"/>
    </linearGradient>
    <linearGradient id="signal" x1="120" y1="92" x2="1080" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6D85B"/>
      <stop offset="0.42" stop-color="#78E0FF"/>
      <stop offset="0.72" stop-color="#FF6A74"/>
      <stop offset="1" stop-color="#F7F5EF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 170) rotate(90) scale(210 280)">
      <stop stop-color="#F6D85B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#11100D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 510) rotate(90) scale(180 260)">
      <stop stop-color="#78E0FF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#11100D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#F7F5EF" stroke-opacity="0.085" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F7F5EF" fill-opacity="0.18"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .gridMove { animation: gridMove 18s linear infinite; }
      .scan { animation: scan 6.8s linear infinite; }
      .dash { stroke-dasharray: 8 14; animation: dash 7.4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .floatA { animation: floatA 5.8s ease-in-out infinite; }
      .floatB { animation: floatB 6.6s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes gridMove { to { transform: translate3d(-42px, -42px, 0); } }
      @keyframes scan { from { transform: translateY(-700px); } to { transform: translateY(700px); } }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%, 100% { opacity: 0.38; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.03); } }
      @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .gridMove, .scan, .dash, .pulse, .floatA, .floatB, .blink { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <g class="gridMove">
    <rect x="-42" y="-42" width="1284" height="704" rx="34" fill="url(#grid)" opacity="0.92"/>
  </g>
  <rect width="1200" height="620" rx="34" fill="url(#dots)" opacity="0.30"/>
  <ellipse cx="880" cy="170" rx="300" ry="220" fill="url(#glowA)"/>
  <ellipse cx="1020" cy="510" rx="280" ry="180" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="618" rx="33" stroke="url(#signal)" stroke-width="2"/>
  <rect class="scan" x="0" y="-100" width="1200" height="132" fill="url(#signal)" opacity="0.075"/>

  <path class="dash" d="M66 494H220L276 438H456L522 372H628" stroke="#F6D85B" stroke-width="2" opacity="0.48"/>
  <path class="dash" d="M548 102H702L756 156H944L1096 308" stroke="#78E0FF" stroke-width="2" opacity="0.44"/>
  <path class="dash" d="M610 538H780L832 486H1126" stroke="#FF6A74" stroke-width="2" opacity="0.42"/>
  <path d="M72 104H224M72 124H174M72 144H278" stroke="#F7F5EF" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M978 96H1124M936 116H1124M996 136H1124" stroke="#F7F5EF" stroke-opacity="0.18" stroke-width="2"/>

  <g transform="translate(44 44)">
    <rect width="1112" height="532" rx="30" fill="#0D0C09" opacity="0.74" stroke="#F7F5EF" stroke-opacity="0.18"/>
    <rect width="1112" height="48" rx="30" fill="#17140F"/>
    <circle cx="30" cy="24" r="6" fill="#F6D85B"/>
    <circle cx="53" cy="24" r="6" fill="#78E0FF"/>
    <circle cx="76" cy="24" r="6" fill="#FF6A74"/>
    <text x="104" y="30" class="mono" font-size="14" fill="#BDB5A6">VINCEMAKES_OS // public workspace // animated svg</text>
    <text x="922" y="30" class="mono" font-size="13" fill="#F6D85B">ACTIVE</text>
    <rect x="984" y="19" width="84" height="10" rx="5" fill="#242017" stroke="#F7F5EF" stroke-opacity="0.18"/>
    <rect class="pulse" x="988" y="22" width="42" height="4" rx="2" fill="#F6D85B"/>
  </g>

  <g transform="translate(86 130)">
    <text class="mono" x="0" y="0" font-size="15" fill="#BDB5A6" letter-spacing="1.4">PUBLIC WORKSPACE / VINCEMAKES</text>
    <text class="serif" x="-4" y="108" font-size="95" fill="#F7F5EF" letter-spacing="-5">Products,</text>
    <text class="serif" x="-4" y="190" font-size="95" fill="#F7F5EF" letter-spacing="-5">tools,</text>
    <text class="serif" x="-4" y="272" font-size="95" fill="#F7F5EF" letter-spacing="-5">systems.</text>
    <text x="2" y="326" class="mono" font-size="18" fill="#D8D1C3">AI-native creative tools, agent workflows,</text>
    <text x="2" y="354" class="mono" font-size="18" fill="#D8D1C3">and product systems for generative media.</text>
    <circle class="pulse" cx="10" cy="382" r="7" fill="#F6D85B" filter="url(#softGlow)"/>
    <text x="30" y="387" class="mono" font-size="14" fill="#BDB5A6">active build: FlowPix.AI</text>
    <text x="276" y="387" class="mono blink" font-size="18" fill="#78E0FF">_</text>
  </g>

  <g transform="translate(628 116)">
    <g class="floatA">
      <rect width="226" height="154" rx="16" fill="url(#signal)"/>
      <rect width="226" height="154" rx="16" fill="url(#dots)" opacity="0.24"/>
      <text x="20" y="34" class="mono" font-size="12" fill="#15130E">ACTIVE PROJECT</text>
      <text x="20" y="100" class="mono" font-size="27" fill="#15130E" font-weight="700">FlowPix.AI</text>
      <text x="20" y="126" class="mono" font-size="13" fill="#15130E" opacity="0.72">image / video / canvas</text>
    </g>

    <g transform="translate(248 0)" class="floatB">
      <rect width="226" height="154" rx="16" fill="#15130E" stroke="#F7F5EF" stroke-opacity="0.20"/>
      <text x="20" y="34" class="mono" font-size="12" fill="#A9A293">SYSTEMS</text>
      <text x="20" y="100" class="mono" font-size="27" fill="#F7F5EF" font-weight="700">Agents</text>
      <text x="20" y="126" class="mono" font-size="13" fill="#BDB5A6">tools / memory / loops</text>
    </g>

    <g transform="translate(0 176)" class="floatB">
      <rect width="226" height="154" rx="16" fill="#15130E" stroke="#F7F5EF" stroke-opacity="0.20"/>
      <text x="20" y="34" class="mono" font-size="12" fill="#A9A293">MEDIA</text>
      <text x="20" y="100" class="mono" font-size="26" fill="#F7F5EF" font-weight="700">Image / Video</text>
      <text x="20" y="126" class="mono" font-size="13" fill="#BDB5A6">generation pipelines</text>
    </g>

    <g transform="translate(248 176)" class="floatA">
      <rect width="226" height="154" rx="16" fill="#15130E" stroke="#F7F5EF" stroke-opacity="0.20"/>
      <text x="20" y="34" class="mono" font-size="12" fill="#A9A293">CRAFT</text>
      <text x="20" y="100" class="mono" font-size="27" fill="#F7F5EF" font-weight="700">Interfaces</text>
      <text x="20" y="126" class="mono" font-size="13" fill="#BDB5A6">taste / frontend</text>
    </g>

    <g transform="translate(0 352)">
      <rect width="474" height="72" rx="16" fill="#15130E" stroke="#F7F5EF" stroke-opacity="0.20"/>
      <text x="22" y="30" class="mono" font-size="12" fill="#A9A293">COORDINATES</text>
      <text x="22" y="54" class="mono" font-size="18" fill="#F7F5EF">hivince.com  /  flowpix.ai  /  @hi__vince</text>
    </g>
  </g>

  <g class="floatA">
    <text x="98" y="558" class="mono" font-size="13" fill="#8E8678">0x01 build useful products</text>
  </g>
  <g class="floatB">
    <text x="306" y="578" class="mono" font-size="13" fill="#8E8678">0x02 turn demos into systems</text>
  </g>
</svg>
